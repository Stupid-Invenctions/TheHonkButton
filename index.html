<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Honk Button</title>
<style>
  :root {
    --bg: #f2efe8;
    --ink: #1c1a17;
    --red: #d7191f;
    --red-dark: #8f0d12;
    --red-light: #ff5a5f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14110f; --ink: #f2efe8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: 1.5rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 9vw, 5rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .honk {
    width: clamp(200px, 55vw, 300px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, var(--red-light), var(--red) 45%, var(--red-dark) 100%);
    box-shadow: 0 14px 0 #5e080b, 0 24px 40px rgba(0,0,0,.35);
    transition: transform .08s ease, box-shadow .08s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .honk:hover { filter: brightness(1.06); }
  .honk:active, .honk.pressed {
    transform: translateY(12px);
    box-shadow: 0 2px 0 #5e080b, 0 8px 16px rgba(0,0,0,.35);
  }
  .honk:focus-visible { outline: 4px solid var(--ink); outline-offset: 8px; }
  .honk:disabled { cursor: wait; filter: saturate(.6); }
  #status { min-height: 1.5rem; margin: 0; font-size: 1.1rem; }
</style>
</head>
<body>
  <h1>The Honk Button</h1>
  <button class="honk" id="honk" type="button" aria-label="Honk"></button>
  <p id="status" role="status" aria-live="polite"></p>

<script>
  const FORMSPREE_URL = "https://formspree.io/f/mrpqobda";
  const btn = document.getElementById("honk");
  const status = document.getElementById("status");

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    status.textContent = "";
    try {
      const res = await fetch(FORMSPREE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ message: "HONK!", sent_at: new Date().toISOString() })
      });
      status.textContent = res.ok ? "HONK enviado!" : "Não deu pra enviar. Tenta de novo.";
    } catch (e) {
      status.textContent = "Sem conexão. Tenta de novo.";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
